[package]
name = "ar-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "LLM provider abstraction: OpenAI-compatible providers, Ollama, vLLM, OpenRouter"

[features]
# Shared LLM test fakes (`ar_llm::testing`). Enable from downstream
# `[dev-dependencies]` only, so release builds never compile them.
test-support = []

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
reqwest.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
