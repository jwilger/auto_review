name: Scheduled dependency advisories

# Pull requests run `just advisories` as the `Dependency advisories` job in
# ci.yml. This workflow reruns the same check against main on a daily
# schedule (and on demand), so an advisory published against a dependency
# already on main fails a run without any code change. A failing scheduled
# run notifies the maintainer through GitHub's workflow-failure
# notifications.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Scheduled dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run just advisories
        run: nix develop .#ci --command just advisories
