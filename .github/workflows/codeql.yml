name: CodeQL

# Static analysis for the Rust workspace and for the workflows themselves.
# Both languages are analysed from source (build-mode: none), so the job
# needs no Nix toolchain.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        env:
          # Local model packs resolve via --additional-packs, not --search-path.
          # The CLI combines this path with the action's PR diff pack path.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            ${{ matrix.language == 'rust' &&
            '{"database":{"run-queries":[
            "--additional-packs=.github/codeql/extensions",
            "--model-packs=jwilger/github-pr-payload"
            ]}}' || '' }}
        with:
          category: "/language:${{ matrix.language }}"
