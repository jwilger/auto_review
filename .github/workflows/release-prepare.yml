name: Prepare release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-prepare:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release') }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: .dependencies/cargo

      - name: Load release secrets
        id: load_secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_RELEASE_AUTOMATION_TOKEN: op://Github Secrets/GH_RELEASE_AUTOMATION_TOKEN/credential

      - env:
          GH_TOKEN: ${{ steps.load_secrets.outputs.GH_RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            printf 'missing GH_RELEASE_AUTOMATION_TOKEN\n' >&2
            exit 1
          fi
          git fetch --tags
          release_plan="$(nix develop --command scripts/release plan --workspace .)"
          CONVENTIONAL_RELEASE_TYPE="$(printf '%s\n' "$release_plan" | awk -F= '$1 == "release_type" { print $2 }')"
          BASELINE_TAG="$(printf '%s\n' "$release_plan" | awk -F= '$1 == "baseline_tag" { print $2 }')"
          release_type_rank() {
            case "$1" in
              patch) printf '0' ;;
              minor) printf '1' ;;
              major) printf '2' ;;
              *) return 1 ;;
            esac
          }
          SEMVER_MINIMUM_RELEASE_TYPE="$CONVENTIONAL_RELEASE_TYPE"
          if [ -n "$BASELINE_TAG" ]; then
            SEMVER_MINIMUM_RELEASE_TYPE=""
            for candidate_type in patch minor major; do
              if nix develop --command cargo semver-checks --workspace --baseline-rev "$BASELINE_TAG" --release-type "$candidate_type"; then
                SEMVER_MINIMUM_RELEASE_TYPE="$candidate_type"
                break
              fi
            done
            if [ -z "$SEMVER_MINIMUM_RELEASE_TYPE" ]; then
              printf 'cargo semver-checks did not accept any release type against baseline %s\n' "$BASELINE_TAG" >&2
              exit 1
            fi
          fi
          if [ "$(release_type_rank "$SEMVER_MINIMUM_RELEASE_TYPE")" -gt "$(release_type_rank "$CONVENTIONAL_RELEASE_TYPE")" ]; then
            RELEASE_TYPE="$SEMVER_MINIMUM_RELEASE_TYPE"
          else
            RELEASE_TYPE="$CONVENTIONAL_RELEASE_TYPE"
          fi
          selected_plan="$(nix develop --command scripts/release plan --workspace . --release-type "$RELEASE_TYPE")"
          RELEASE_VERSION="$(printf '%s\n' "$selected_plan" | awk -F= '$1 == "version" { print $2 }')"
          if [ -z "$RELEASE_VERSION" ] || [ -z "$RELEASE_TYPE" ]; then
            printf 'release plan did not produce a version and release type\n' >&2
            exit 1
          fi
          branch="release/v$RELEASE_VERSION"
          base_sha="$(git rev-parse HEAD)"
          release_files=(Cargo.toml Cargo.lock CHANGELOG.md)
          nix develop --command scripts/release prepare --workspace . --version "$RELEASE_VERSION" --date "$(date +%F)"
          mapfile -t changed_files < <(git diff --name-only -- "${release_files[@]}")
          if [ "${#changed_files[@]}" -eq 0 ]; then
            printf 'release metadata already up to date for v%s\n' "$RELEASE_VERSION"
            exit 0
          fi

          # The all-branches ruleset requires verified signatures and forbids
          # force-pushes. Release commits are therefore created through the
          # GraphQL createCommitOnBranch mutation (GitHub signs them), and a
          # stale release branch is deleted and recreated instead of rewritten.
          branch_is_current=false
          if head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            head_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha")"
            head_parents="$(printf '%s\n' "$head_commit" | jq -r '[.parents[].sha] | join(" ")')"
            head_tree="$(printf '%s\n' "$head_commit" | jq -r '.tree.sha')"
            if [ "$head_parents" = "$base_sha" ]; then
              remote_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$head_tree")"
              branch_is_current=true
              for release_file in "${release_files[@]}"; do
                local_blob="$(git hash-object -- "$release_file")"
                remote_blob="$(printf '%s\n' "$remote_tree" | jq -r --arg path "$release_file" '.tree[] | select(.path == $path) | .sha')"
                if [ "$local_blob" != "$remote_blob" ]; then
                  branch_is_current=false
                  break
                fi
              done
            fi
            if [ "$branch_is_current" = false ]; then
              printf 'replacing stale %s (head %s)\n' "$branch" "$head_sha"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          fi

          if [ "$branch_is_current" = true ]; then
            printf '%s already holds the release commit for %s\n' "$branch" "$base_sha"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha" --silent
            work_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-commit.XXXXXX")"
            trap 'rm -rf "$work_dir"' EXIT
            for release_file in "${changed_files[@]}"; do
              base64 -w0 -- "$release_file" | jq -Rs --arg path "$release_file" '{path: $path, contents: .}' >> "$work_dir/additions.jsonl"
            done
            jq -s \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "$branch" \
              --arg base_sha "$base_sha" \
              --arg headline "chore: release v$RELEASE_VERSION" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {
                  input: {
                    branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                    expectedHeadOid: $base_sha,
                    message: { headline: $headline },
                    fileChanges: { additions: . }
                  }
                }
              }' "$work_dir/additions.jsonl" > "$work_dir/create-commit.json"
            gh api graphql --input "$work_dir/create-commit.json" --jq '.data.createCommitOnBranch.commit | "created signed release commit \(.oid) \(.url)"'
          fi

          open_prs_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --limit 100)"
          superseded_prs="$(printf '%s\n' "$open_prs_json" | jq -r --arg branch "$branch" '.[] | select(.headRefName | startswith("release/v")) | select(.headRefName != $branch) | .number')"
          for superseded_pr in $superseded_prs; do
            gh pr close "$superseded_pr" --repo "$GITHUB_REPOSITORY"
          done
          existing_pr="$(printf '%s\n' "$open_prs_json" | jq -r --arg branch "$branch" '.[] | select(.headRefName == $branch) | .number' | head -n 1)"
          body="Prepare release v$RELEASE_VERSION from branch $branch using scripts/release prepare. This version bump updates Cargo.toml, Cargo.lock, and CHANGELOG.md with semver-selected release metadata before merge to main."
          if [ -z "$existing_pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title "chore: release v$RELEASE_VERSION" --body "$body"
          else
            printf 'release PR already open: #%s\n' "$existing_pr"
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
