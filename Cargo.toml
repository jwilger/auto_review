[workspace]
resolver = "2"
members = [
    "crates/ar-agentcore",
    "crates/ar-forge",
    "crates/ar-github",
    "crates/ar-gateway",
    "crates/ar-orchestrator",
    "crates/ar-forgejo",
    "crates/ar-llm",
    "crates/ar-index",
    "crates/ar-prompts",
    "crates/ar-review",
    "crates/ar-chat",
    "crates/ar-cli",
]

[workspace.package]
version = "1.8.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jwilger/auto_review"
# Workspace crates are application code, not crates.io packages.
# `publish = false` also tells cargo-deny these are private path
# crates so wildcard internal deps (`ar-* = { path = "..." }`)
# don't trip the wildcards-deny rule. The toolchain itself is
# pinned via rust-toolchain.toml + flake.lock; no MSRV here
# because there's no downstream consumer to constrain.
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
aws-config = { version = "1.13.2", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
url = "2.5"
axum = "0.8"
tower = "0.5"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"

# dev-deps shared via [workspace.dependencies] so per-crate Cargo.toml
# files can reference them with `.workspace = true`.
wiremock = "0.6"

[workspace.lints.rust]
unfulfilled_lint_expectations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# We deliberately triage the whole restriction group rather than handpick rules.
# Revisit if we replace that review strategy with a targeted baseline.
blanket_clippy_restriction_lints = "allow"
# Tail expressions are our expression-oriented Rust style, not missing returns.
# Revisit if we deliberately adopt explicit returns as a project convention.
implicit_return = "allow"
# Typed error composition uses ?; cleanup and cause preservation remain reviewed.
# Revisit if concrete failures show that a syntax ban improves those guarantees.
question_mark_used = "allow"
# Provided trait defaults are intentional behavior, not incomplete implementations.
# Revisit if an introduced trait requires explicit overrides for correctness.
missing_trait_methods = "allow"
# Named responsibility boundaries are useful even with only one caller.
# Revisit if single-use abstractions demonstrably obscure rather than clarify code.
single_call_fn = "allow"
# Argument-position impl Trait is supported in our own and generated APIs.
# Revisit if named generic parameters become a deliberate API requirement.
impl_trait_in_params = "allow"
# Every consumer lives in this workspace (`publish = false`); closed enums permit coordinated exhaustive review.
# Revisit before exposing independently evolving APIs to consumers outside this workspace.
exhaustive_enums = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
